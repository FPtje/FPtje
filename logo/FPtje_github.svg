<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <mask id="cutout">
      <rect width="100%" height="100%" fill="white" />
      <!-- Transparent hole cutout -->
      <circle cx="346.2" cy="102.6" r="48.7" fill="black" />
    </mask>
  </defs>

  <!-- Main Large Circle with Cutout -->
  <circle cx="250" cy="250" r="250" fill="#f67300" mask="url(#cutout)" />

  <!-- Central "FPtje" Text -->
  <text x="250" y="403.8" fill="#ffffff" font-family="Ubuntu, 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="134.6" font-weight="bold" text-anchor="middle">FPtje</text>
</svg>
